
    <div class="container">
        <h1>Counter App</h1>

        <div id="count">{{count}}</div>

        <div class="buttons">
            <button class="decrease" (click)="decrease()">- Decrease</button>
            <button class="reset" (click)="reset()">Reset</button>
            <button class="increase" (click)="increase()">+ Increase</button>
        </div>
    </div>
